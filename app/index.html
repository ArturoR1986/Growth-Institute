<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Institute · Sponsor View</title>
<style>
:root{--bg:#190e30;--surface:#281744;--card:#342151;--border:#553e72;--accent:#c4a5f4;--text:#faf7ff;--muted:#c3b6d5;--radius:20px;--gap:24px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif;padding:48px 24px}main{max-width:1180px;margin:auto;background:var(--surface);padding:36px;border-radius:28px;border:1px solid var(--border)}header{display:flex;justify-content:space-between;gap:24px;align-items:start;margin-bottom:32px}.brand{font-size:17px;font-weight:750}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}h1{font-size:29px;margin:18px 0 3px;line-height:1.2}h2{font-size:18px;margin:0 0 6px}h3{font-size:16px}p{margin:6px 0;color:var(--muted)}.identity{text-align:right}.badge{display:inline-block;border:1px solid var(--border);border-radius:24px;padding:5px 12px;margin-top:14px;color:var(--accent)}.grid{display:grid;gap:var(--gap)}.stats{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:repeat(2,1fr);margin:24px 0}.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px}.metric{font-size:45px;line-height:1.2;font-weight:650;margin:18px 0 9px;letter-spacing:-1px}.metric small{font-size:20px;font-weight:400;color:var(--muted)}progress{width:100%;height:8px;accent-color:var(--accent);margin:12px 0}progress::-webkit-progress-bar{background:#55416b;border-radius:8px}progress::-webkit-progress-value{background:var(--accent);border-radius:8px}.bars{height:222px;display:flex;gap:12px;align-items:end;margin-top:24px;border-bottom:1px solid var(--border);padding:0 4px}.column{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:end;text-align:center}.bar{background:var(--accent);border-radius:7px 7px 0 0;min-height:2px}.bar.future{background:transparent;border:1px dashed var(--border)}.value{font-size:12px;margin-bottom:6px}.label{font-size:11px;color:var(--muted);height:43px;padding-top:9px}.legend{font-size:12px;margin-top:12px}.teamhead{display:flex;justify-content:space-between;align-items:center;gap:16px}button{font:inherit;color:var(--text);background:#493061;border:1px solid #785795;border-radius:9px;padding:8px 14px;cursor:pointer}button:hover{background:#614279}button:focus-visible{outline:3px solid #eedcff;outline-offset:4px}.tabs{display:flex;gap:10px;margin:24px 0}.tabs button[aria-pressed=true]{background:var(--accent);color:#241333}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;border-bottom:1px solid var(--border);padding:14px 10px}th{color:var(--muted);font-weight:500}td small{display:block;color:var(--muted)}.scroll{overflow-x:auto}.name{background:none;border:0;padding:0;color:var(--accent);text-align:left}.detail{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}.histories{grid-template-columns:1fr 1fr}.history{padding:12px 0;border-bottom:1px solid var(--border)}.history small{display:block;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:20px;font-size:11px;color:var(--muted);margin-top:28px}#status{padding:40px;text-align:center}summary{cursor:pointer;color:var(--accent)}[hidden]{display:none!important}@media(max-width:750px){body{padding:12px}main{padding:20px}.stats,.charts,.histories{grid-template-columns:1fr}header{display:block}.identity{text-align:left;margin-top:20px}h1{font-size:25px}footer{display:block}.bars{gap:8px}.card{padding:19px}.teamhead{align-items:start}}
</style><main><div id="status" role="status">Loading sponsor dashboard…</div><div id="dashboard" hidden></div></main>
<script>
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const date=v=>v?new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(v)):'None recorded';
const shortDate=v=>new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(v));
let data,tab='active',selected=null,page=0;const pageSize=20;
function card(title,value,note){const c=node('section',undefined,'card');c.append(node('h2',title),node('div',value,'metric'),node('p',note));return c}
function chart(title,note,rows,label){const c=node('section',undefined,'card');c.append(node('h2',title),node('p',note));const bars=node('div',undefined,'bars');bars.setAttribute('role','img');bars.setAttribute('aria-label',title+': '+rows.map(r=>label(r)+' '+(r.upcoming?'upcoming':r.count+' of '+r.eligible)).join('; '));for(const r of rows){const col=node('div',undefined,'column');col.title=r.title+' · '+(r.upcoming?'Upcoming':r.count+' / '+r.eligible);col.append(node('span',r.upcoming?'—':r.count+'/'+r.eligible,'value'));const b=node('div',undefined,'bar'+(r.upcoming?' future':''));b.style.height=(r.upcoming?8:r.eligible?r.count/r.eligible*155:0)+'px';col.append(b,node('span',label(r),'label'));bars.append(col)}c.append(bars);return c}
function render(){const root=document.querySelector('#dashboard');root.replaceChildren();const header=node('header');const intro=node('div');intro.append(node('div','GROWTH INSTITUTE','brand'),node('div','Sponsor View','eyebrow'),node('h1',data.company),node('p',data.program));const identity=node('div',undefined,'identity');identity.append(node('strong',data.sponsor.name),node('p',data.sponsor.title),node('span','Week '+data.week+' of '+data.weeks,'badge'));const logout=node('form');logout.method='POST';logout.action='/logout';logout.append(node('button','Sign out'));identity.append(logout);header.append(intro,identity);root.append(header);
const stats=node('div',undefined,'grid stats');stats.append(card('Active learners',data.active,data.enrolled+' enrolled · '+data.withdrawn+' withdrawn'));const completion=card('Released modules completed',data.percent===null?'Not available':data.percent+'%',data.completed+' of '+data.opportunities+' · current active learners');const progress=node('progress');progress.max=data.opportunities||1;progress.value=data.completed;progress.setAttribute('aria-label','Released module completion');completion.append(progress);stats.append(completion);const latest=data.sessions.filter(s=>s.state==='Finished').at(-1);stats.append(card('Latest session attendance',latest?latest.count+' / '+latest.eligible:'Not available',latest?'Session '+latest.week+' · '+date(latest.date):'No finished sessions'));root.append(stats);
const charts=node('div',undefined,'grid charts');const attendance=chart('Live session participation','Unique learners joined · eligible at each session',data.sessions.filter(s=>s.state==='Finished'),s=>'W'+s.week);attendance.append(node('p','Counts reflect historical enrollment eligibility.','legend'));const durationDetails=node('details');durationDetails.append(node('summary','Session dates and connected duration'));for(const s of data.sessions){durationDetails.append(node('p','Session '+s.week+' · '+date(s.date)+' · '+s.state+(s.state==='Finished'?' · '+(s.averageMinutes===null?'Duration not available':s.averageMinutes+' min average among '+s.measuredAttendees+' measured attendees'):'')))}durationDetails.append(node('p','Connections are clipped to scheduled time. Minutes connected do not measure attention.','legend'));attendance.append(durationDetails);const modules=chart('Completion by module','Current active learners · released modules only',data.modules,m=>'M'+m.order);for(const m of data.modules.filter(m=>m.currentWeek))modules.append(node('p','M'+m.order+' · Released '+shortDate(m.release)+' · Current week','legend'));modules.append(node('p','Dashed bars: upcoming · no module deadlines supplied.','legend'));const info=node('details');info.append(node('summary','Module titles and release context'));for(const m of data.modules)info.append(node('p','M'+m.order+' · '+m.title+' · '+(m.upcoming?'Upcoming':'Released')+' '+date(m.release)));modules.append(info);charts.append(attendance,modules);root.append(charts);
const team=node('section',undefined,'card');const head=node('div',undefined,'teamhead');const heading=node('div');heading.append(node('h2','Team participation'),node('p','Recorded activity to support your next conversation'));const toggle=node('button','Expand ↓');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-controls','team-body');const body=node('div');body.id='team-body';body.hidden=true;toggle.onclick=()=>{body.hidden=!body.hidden;toggle.textContent=body.hidden?'Expand ↓':'Collapse ↑';toggle.setAttribute('aria-expanded',String(!body.hidden))};head.append(heading,toggle);team.append(head,body);root.append(team);
function teamBody(){body.replaceChildren();const tabs=node('div',undefined,'tabs');for(const status of ['active','withdrawn']){const b=node('button',(status==='active'?'Active':'Withdrawn')+' ('+data.people.filter(p=>p.status===status).length+')');b.setAttribute('aria-pressed',String(tab===status));b.onclick=()=>{tab=status;selected=null;page=0;teamBody();body.querySelectorAll('.tabs button')[status==='active'?0:1].focus()};tabs.append(b)}body.append(tabs);const people=data.people.filter(p=>p.status===tab);if(!people.length)body.append(node('p','No learners in this group.'));const wrap=node('div',undefined,'scroll'),table=node('table'),thead=node('thead'),tr=node('tr');for(const t of ['Learner / role','Modules','Sessions','Latest recorded participation'])tr.append(node('th',t));thead.append(tr);table.append(thead);const tbody=node('tbody');for(const person of people.slice(page*pageSize,(page+1)*pageSize)){const row=node('tr'),name=node('td'),b=node('button',person.name+(selected===person.id?' · Hide details ▴':' · View details ▾'),'name');b.setAttribute('aria-expanded',String(selected===person.id));b.setAttribute('aria-controls','learner-detail');b.dataset.learnerId=person.id;b.onclick=()=>{selected=selected===person.id?null:person.id;teamBody();if(selected)document.querySelector('#learner-detail').focus();else [...body.querySelectorAll('.name')].find(b=>b.dataset.learnerId===person.id)?.focus()};name.append(b,node('small',person.title));row.append(name,node('td',person.completed+'/'+person.moduleEligible),node('td',person.joined+'/'+person.sessionEligible),node('td',date(person.latest)));tbody.append(row)}table.append(tbody);wrap.append(table);body.append(wrap);if(people.length>pageSize){const paging=node('div',undefined,'tabs');const previous=node('button','Previous'),next=node('button','Next');previous.disabled=page===0;next.disabled=(page+1)*pageSize>=people.length;previous.onclick=()=>{page--;selected=null;teamBody()};next.onclick=()=>{page++;selected=null;teamBody()};paging.append(previous,node('span','Page '+(page+1)+' of '+Math.ceil(people.length/pageSize)),next);body.append(paging)}body.append(node('p','Latest activity includes valid module completions and eligible session connections only.','legend'));
const person=people.find(p=>p.id===selected);if(!person)return;const d=node('section',undefined,'detail');d.id='learner-detail';d.tabIndex=-1;d.append(node('h3',person.name+' · recorded participation'));if(person.withdrawnAt)d.append(node('p','Withdrawn '+date(person.withdrawnAt)+' · historical activity'));const histories=node('div',undefined,'grid histories'),mh=node('div'),sh=node('div');mh.append(node('h3','Module history'));for(const m of person.modules){const item=node('div',m.title,'history');item.append(node('small',m.completedAt?'Completed '+date(m.completedAt):m.state),node('small','Release · '+date(m.release)));mh.append(item)}sh.append(node('h3','Session history'));for(const s of person.sessions){const item=node('div',s.title,'history');item.append(node('small',date(s.date)+' · '+s.state+(s.minutes!==null?' · '+s.minutes+' min connected':'')));sh.append(item)}histories.append(mh,sh);d.append(histories,node('h3','Weekly recorded activity'));const tw=node('div',undefined,'scroll'),wt=node('table'),wh=node('tr');for(const t of ['Program week','Module completions','Classes joined','Average denominator'])wh.append(node('th',t));wt.append(wh);for(const w of person.weekly){const r=node('tr');for(const v of ['Week '+w.week,w.modules,w.sessions,w.completedEligible?'Completed eligible week':'Excluded: partial, future or ineligible'])r.append(node('td',v));wt.append(r)}tw.append(wt);d.append(tw,node('p','Per completed eligible week ('+person.completedWeeks+'): '+(person.averageModules??'Not available')+' module completions · '+(person.averageSessions??'Not available')+' classes joined.'),node('p','Minutes connected do not measure attention. Completion and attendance do not establish learning impact.','legend'));body.append(d)}teamBody();
const foot=node('footer');foot.append(node('span',(data.mock?'Fictional mock data · ':'')+'Snapshot '+date(data.snapshot)+' '+new Date(data.snapshot).toISOString().slice(11,19)+' UTC'),node('span','Participation measures · Learning impact not measured'));root.append(foot);if(!data.people.length)root.append(node('p','No enrolled learners in this snapshot.'));root.hidden=false}
async function load(){try{const res=await fetch('/api/dashboard');data=await res.json();if(res.status===401){location.assign('/login');return}if(!res.ok)throw Error(data.error);render();document.querySelector('#status').hidden=true}catch(e){const status=document.querySelector('#status');status.replaceChildren(node('p',e.message||'Unable to load dashboard.'));const retry=node('button','Retry');retry.onclick=load;status.append(retry)}}load();
</script></html>
